<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live PnL</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #15161c;
    --line: #23252d;
    --text: #e8e9ed;
    --muted: #8a8e99;
    --up: #2ebd85;
    --down: #f6465d;
    --accent: #ff6a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* OHLC legend */
  #legend { position: fixed; top: 12px; left: 16px; font-size: 13px; line-height: 1.6; pointer-events: none;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #legend .name { color: var(--text); margin-right: 8px; }
  #legend .k { color: var(--muted); margin-left: 6px; }
  #legend .up { color: var(--up); } #legend .down { color: var(--down); }

  /* PnL widget */
  #pnlBox { position: fixed; top: 60px; left: 16px; padding: 0; border-radius: 10px;
    pointer-events: none; text-shadow: 0 2px 12px #000; }
  #pnlBox .lbl { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 15px; font-weight: 500; }
  #pnlBox .lbl svg { width: 15px; height: 15px; color: var(--up); }
  #pnlBox.running .lbl svg { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pnl { font-size: clamp(26px, 4.2vw, 44px); font-weight: 700; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; margin-top: 2px; color: var(--up); }
  #pnl.down { color: var(--down); }

  /* controls */
  #bar { position: fixed; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; align-items: center; width: max-content;
    max-width: calc(100% - 100px); padding: 8px; border-radius: 12px; background: rgba(11,11,15,.85);
    border: 1px solid var(--line); transition: opacity .4s; }
  #bar.idle { opacity: 0; }
  .field { display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 10px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .field input { width: 92px; background: transparent; border: 0; outline: 0; color: var(--text);
    font: inherit; font-size: 14px; font-variant-numeric: tabular-nums; }
  button { height: 34px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); font: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer; background: var(--panel); color: var(--text); }
  #toggle.start { background: var(--up); border-color: var(--up); color: #04150d; }
  #toggle.stop { background: var(--down); border-color: var(--down); color: #fff; }
  #fs { width: 34px; padding: 0; display: grid; place-items: center; }
  #fs svg { width: 16px; height: 16px; }

  @media (max-width: 720px) {
    #bar { max-width: calc(100% - 16px); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); }
    #pnlBox { top: calc(54px + env(safe-area-inset-top, 0px)); }
    #legend { font-size: 11px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="legend"></div>

<div id="pnlBox">
  <div class="lbl">PnL
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </div>
  <div id="pnl">+$0 (+0%)</div>
</div>

<div id="bar">
  <label class="field">Start MC $<input id="startMc" type="number" inputmode="decimal" step="any" value="10000"></label>
  <label class="field">Target MC $<input id="targetMc" type="number" inputmode="decimal" step="any" value="5000000"></label>
  <label class="field">PnL at target $<input id="amount" type="number" inputmode="decimal" step="any" value="25000"></label>
  <button id="toggle" class="start">Start</button>
  <button id="reset">Reset</button>
  <button id="fs" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<script>
(() => {
  const TICK_MS = 40;              // price ticks: 25 per second
  const CANDLE_MS = 1000;          // one candle per second
  const KEEP = 600;                // candles kept in memory
  const KEY = 'livepnl.v3';

  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const BG = css('--bg'), UP = css('--up'), DOWN = css('--down'), ACCENT = css('--accent');

  // ---------- state ----------
  // the chart is market cap; PnL comes from a position bought at the start market cap
  let s = { mc: 10000, startMc: 10000, targetMc: 5000000, goalPnl: 25000, liveTarget: 5000000,
            running: false, ret: 0, swing: 0, vol: 1, t: Date.now() };
  let candles = [];
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved.mc === 'number') { s = { ...s, ...saved }; candles = saved.candles || []; }
  } catch (e) {}
  $('amount').value = s.goalPnl; $('startMc').value = s.startMc; $('targetMc').value = s.targetMc;
  if (!candles.length) newCandle(Date.now());

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ ...s, t: Date.now(), candles: candles.slice(-KEEP) })); } catch (e) {}
  }

  function newCandle(t) {
    const p = s.mc;
    candles.push({ t, o: p, h: p, l: p, c: p, v: 0 });
    if (candles.length > KEEP) candles.splice(0, candles.length - KEEP);
  }

  // ---------- price model ----------
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  function step() {
    const baseVol = 0.0019;                                              // per-tick log volatility
    s.vol += (1 - s.vol) * 0.02 + Math.abs(gauss()) * 0.06 - 0.03;
    if (Math.random() < 0.004) s.vol += 1.2 + Math.random() * 1.5;      // volatility burst
    s.vol = Math.min(Math.max(s.vol, 0.35), 4);

    const x = Math.log(s.mc), gap = Math.log(s.liveTarget) - x;
    s.swing = s.swing * 0.985 + gauss() * 0.16;                          // rallies & pullbacks
    if (Math.random() < 0.006) s.swing = -s.swing * 1.4;                 // sharp reversal
    const drift = Math.min(gap * 0.0004, 0.0016) + 0.0003 + s.swing * baseVol * 0.8;
    s.ret = s.ret * 0.45 + gauss() * baseVol * s.vol;
    s.mc = Math.exp(x + drift + s.ret);
    if (gap < 0) s.liveTarget *= 1.00003;                                // keeps going after target

    const c = candles[candles.length - 1];
    c.c = s.mc; if (s.mc > c.h) c.h = s.mc; if (s.mc < c.l) c.l = s.mc;
    c.v += (Math.abs(s.ret) / baseVol) * (0.6 + Math.random()) * s.vol * 40 + Math.random() * 6;
  }

  // ---------- formatting ----------
  const money = n => '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function compact(n) {
    const a = Math.abs(n), sign = n < 0 ? '-' : '';
    if (a >= 1e9) return sign + '$' + (a / 1e9).toFixed(2) + 'B';
    if (a >= 1e6) return sign + '$' + (a / 1e6).toFixed(2) + 'M';
    if (a >= 1e4) return sign + '$' + (a / 1e3).toFixed(1) + 'K';
    return sign + '$' + a.toLocaleString('en-US', { maximumFractionDigits: a < 100 ? 2 : 0 });
  }
  const pad = n => String(n).padStart(2, '0');
  const hms = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };

  // size is picked so you make exactly "PnL at target" when MC reaches "Target MC"
  const size = () => s.goalPnl / Math.max(s.targetMc / s.startMc - 1, 1e-9);
  const pnlNow = () => size() * (s.mc / s.startMc - 1);
  function renderText() {
    const p = pnlNow(), pct = (s.mc / s.startMc - 1) * 100;
    const el = $('pnl');
    el.textContent = (p >= 0 ? '+' : '-') + money(p) + ' (' + (pct >= 0 ? '+' : '') + pct.toLocaleString('en-US', { maximumFractionDigits: pct >= 1000 ? 0 : 2 }) + '%)';
    el.className = p >= 0 ? '' : 'down';

    const c = candles[candles.length - 1], cls = c.c >= c.o ? 'up' : 'down';
    const chg = c.c - c.o, chgPct = c.o ? (chg / Math.abs(c.o)) * 100 : 0;
    $('legend').innerHTML =
      `<span class="name">Market cap · 1s · live</span>` +
      `<span class="k">O</span><span class="${cls}">${compact(c.o)}</span>` +
      `<span class="k">H</span><span class="${cls}">${compact(c.h)}</span>` +
      `<span class="k">L</span><span class="${cls}">${compact(c.l)}</span>` +
      `<span class="k">C</span><span class="${cls}">${compact(c.c)}</span>` +
      `<span class="${cls}" style="margin-left:6px">${chg >= 0 ? '+' : ''}${compact(chg)} (${chgPct >= 0 ? '+' : ''}${chgPct.toFixed(2)}%)</span><br>` +
      `<span class="name" style="color:var(--muted)">Volume</span><span class="${cls}">${c.v.toFixed(2)}</span>`;
  }

  // ---------- controls ----------
  function setRunning(on) {
    s.running = on;
    const b = $('toggle'); b.textContent = on ? 'Stop' : 'Start'; b.className = on ? 'stop' : 'start';
    $('pnlBox').classList.toggle('running', on);
    lastTick = performance.now();
    if (on) nextCandleAt = Date.now() + CANDLE_MS;
    save();
  }
  function applyInputs() {
    const g = parseFloat($('amount').value), a = parseFloat($('startMc').value), b = parseFloat($('targetMc').value);
    if (Number.isFinite(g)) s.goalPnl = g;
    if (Number.isFinite(a) && a > 0) s.startMc = a;
    if (Number.isFinite(b) && b > 0 && b !== s.targetMc) { s.targetMc = b; s.liveTarget = b; }
    renderText(); save();
  }
  $('toggle').onclick = () => { applyInputs(); setRunning(!s.running); };
  $('amount').addEventListener('change', applyInputs);
  $('startMc').addEventListener('change', applyInputs);
  $('targetMc').addEventListener('change', applyInputs);
  document.querySelectorAll('#bar input').forEach(i => i.addEventListener('keydown', e => {
    if (e.key === 'Enter') { applyInputs(); if (!s.running) setRunning(true); }
  }));
  $('reset').onclick = () => {
    applyInputs(); s.mc = s.startMc; s.liveTarget = s.targetMc; s.ret = 0; s.swing = 0; s.vol = 1;
    candles = []; newCandle(Date.now()); nextCandleAt = Date.now() + CANDLE_MS;
    viewMin = viewMax = null; renderText(); save();
  };
  $('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); $('toggle').click(); }
    if (e.key === 'f') $('fs').click();
  });
  // hide the control bar when the mouse is idle while it's running
  let idleTimer;
  const wake = () => { $('bar').classList.remove('idle'); clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (s.running && !$('bar').matches(':focus-within')) $('bar').classList.add('idle'); }, 2500); };
  ['mousemove', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, wake));

  // ---------- chart ----------
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  let viewMin = null, viewMax = null, volMax = null;
  function niceStep(range, count) {
    const raw = range / count, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
  }
  const crisp = v => Math.round(v) + 0.5;
  const FONT = '12px Inter, ui-sans-serif, system-ui, sans-serif';

  function draw() {
    const AXIS_R = 78, AXIS_B = 28, TOP = 150;
    const cw = W - AXIS_R, chartBottom = H - AXIS_B;
    const volH = (chartBottom - TOP) * 0.2;
    const priceBottom = chartBottom - volH - 10;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

    const spacing = W < 720 ? 7 : 9, body = Math.max(3, Math.round(spacing * 0.68));
    const rightPad = spacing * 4;
    const count = Math.min(candles.length, Math.floor((cw - rightPad) / spacing));
    const vis = candles.slice(-count);
    const xOf = i => cw - rightPad - (vis.length - 1 - i) * spacing;

    // smooth autoscale
    let lo = Infinity, hi = -Infinity, vmax = 1;
    for (const c of vis) { if (c.l < lo) lo = c.l; if (c.h > hi) hi = c.h; if (c.v > vmax) vmax = c.v; }
    const span = Math.max(hi - lo, hi * 0.01);
    const tMin = lo - span * 0.08, tMax = hi + span * 0.08;
    if (viewMin === null) { viewMin = tMin; viewMax = tMax; volMax = vmax; }
    viewMin += (tMin - viewMin) * 0.1; viewMax += (tMax - viewMax) * 0.1; volMax += (vmax - volMax) * 0.1;
    const y = v => TOP + (1 - (v - viewMin) / (viewMax - viewMin)) * (priceBottom - TOP);

    // grid + price axis
    ctx.font = FONT; ctx.textBaseline = 'middle'; ctx.lineWidth = 1;
    const gs = niceStep(viewMax - viewMin, 9);
    for (let g = Math.ceil(viewMin / gs) * gs; g <= viewMax; g += gs) {
      const yy = crisp(y(g));
      ctx.strokeStyle = '#16171d'; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(cw, yy); ctx.stroke();
      ctx.fillStyle = '#9a9ea8'; ctx.fillText(compact(g), cw + 10, yy);
    }

    // time axis
    const every = Math.max(1, Math.round(90 / spacing));
    ctx.fillStyle = '#9a9ea8'; ctx.textAlign = 'center';
    for (let i = 0; i < vis.length; i++) {
      const t = vis[i].t; if (Math.round(t / CANDLE_MS) % every) continue;
      const xx = crisp(xOf(i));
      ctx.strokeStyle = '#121318'; ctx.beginPath(); ctx.moveTo(xx, TOP - 20); ctx.lineTo(xx, chartBottom); ctx.stroke();
      ctx.fillText(hms(t), xx, H - AXIS_B / 2);
    }
    ctx.textAlign = 'left';

    // volume + candles
    for (let i = 0; i < vis.length; i++) {
      const c = vis[i], up = c.c >= c.o, col = up ? UP : DOWN, x = xOf(i);
      const vh = Math.max(1, (c.v / volMax) * volH);
      ctx.fillStyle = up ? 'rgba(46,189,133,.45)' : 'rgba(246,70,93,.45)';
      ctx.fillRect(Math.round(x - body / 2), Math.round(chartBottom - vh), body, Math.round(vh));

      ctx.strokeStyle = col; ctx.fillStyle = col;
      const xx = crisp(x);
      ctx.beginPath(); ctx.moveTo(xx, Math.round(y(c.h))); ctx.lineTo(xx, Math.round(y(c.l))); ctx.stroke();
      const top = Math.round(y(Math.max(c.o, c.c))), bot = Math.round(y(Math.min(c.o, c.c)));
      ctx.fillRect(Math.round(x - body / 2), top, body, Math.max(1, bot - top));
    }

    // current price line + tags
    const last = vis[vis.length - 1], ly = crisp(y(last.c));
    ctx.setLineDash([1, 3]); ctx.strokeStyle = ACCENT;
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(cw, ly); ctx.stroke(); ctx.setLineDash([]);
    tag(compact(last.c), ly, cw);
    tag(last.v.toFixed(2), crisp(chartBottom - Math.max(1, (last.v / volMax) * volH)), cw);

    // separators
    ctx.strokeStyle = '#1b1c22';
    ctx.beginPath(); ctx.moveTo(crisp(cw), 0); ctx.lineTo(crisp(cw), H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, crisp(chartBottom)); ctx.lineTo(W, crisp(chartBottom)); ctx.stroke();
  }
  function tag(text, yy, cw) {
    ctx.font = '600 ' + FONT;
    const w = Math.max(ctx.measureText(text).width + 12, 54);
    ctx.fillStyle = ACCENT; ctx.beginPath(); ctx.roundRect(cw + 2, yy - 10, w, 20, 3); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(text, cw + 8, yy);
    ctx.font = FONT;
  }

  // ---------- loop ----------
  let lastTick = performance.now(), nextCandleAt = Date.now() + CANDLE_MS, lastSave = 0;
  function frame(now) {
    if (s.running) {
      let k = 0;
      while (now - lastTick >= TICK_MS && k < 500) { step(); lastTick += TICK_MS; k++; }
      if (k === 500) lastTick = now;
      const wall = Date.now();
      while (wall >= nextCandleAt) { newCandle(nextCandleAt); nextCandleAt += CANDLE_MS; }
      if (k) renderText();
      if (now - lastSave > 2000) { save(); lastSave = now; }
    }
    draw();
    requestAnimationFrame(frame);
  }

  // was running when the page closed? fast-forward the time it was away so it keeps going 24/7
  if (s.running) {
    const away = Math.max(0, Date.now() - (s.t || Date.now()));
    const tpc = CANDLE_MS / TICK_MS;
    const nCandles = Math.min(Math.floor(away / CANDLE_MS), 20000);
    const start = Date.now() - nCandles * CANDLE_MS;
    for (let i = 0; i < nCandles; i++) {
      newCandle(start + i * CANDLE_MS);
      for (let j = 0; j < tpc; j++) step();
    }
  }

  resize();
  renderText();
  setRunning(s.running);
  wake();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
