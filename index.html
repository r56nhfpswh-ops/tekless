<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hi</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05030d; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<h1>hi</h1>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, particles = [];
  const mouse = { x: -9999, y: -9999, down: false };

  function targets() {
    const off = document.createElement('canvas');
    const octx = off.getContext('2d');
    off.width = W; off.height = H;
    const size = Math.min(W * 0.55, H * 0.75);
    octx.fillStyle = '#fff';
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.font = `900 ${size}px "Helvetica Neue", Arial, sans-serif`;
    octx.fillText('hi', W / 2, H / 2 + size * 0.04);
    const data = octx.getImageData(0, 0, W, H).data;
    const gap = Math.max(4, Math.round(size / 70));
    const pts = [];
    for (let y = 0; y < H; y += gap)
      for (let x = 0; x < W; x += gap)
        if (data[(y * W + x) * 4 + 3] > 128) pts.push({ x, y });
    return { pts, gap };
  }

  function build() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const { pts, gap } = targets();
    particles = pts.map((p, i) => {
      const old = particles[i];
      return {
        tx: p.x, ty: p.y,
        x: old ? old.x : Math.random() * W,
        y: old ? old.y : Math.random() * H,
        vx: 0, vy: 0,
        r: gap * 0.42,
        hue: 300 - (p.x / W) * 110 + (p.y / H) * 30,
        seed: Math.random() * Math.PI * 2,
      };
    });
  }

  function frame(t) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5, 3, 13, 0.28)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const radius = mouse.down ? 220 : 110;
    const time = t * 0.001;
    for (const p of particles) {
      const wob = reduce ? 0 : 1.6;
      const gx = p.tx + Math.cos(time * 1.3 + p.seed) * wob;
      const gy = p.ty + Math.sin(time * 1.7 + p.seed) * wob;
      p.vx += (gx - p.x) * 0.045;
      p.vy += (gy - p.y) * 0.045;
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < radius * radius) {
        const d = Math.sqrt(d2) || 1;
        const f = (1 - d / radius) * (mouse.down ? 14 : 7);
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }
      p.vx *= 0.84; p.vy *= 0.84;
      p.x += p.vx; p.y += p.vy;
      const speed = Math.min(Math.hypot(p.vx, p.vy), 20);
      const hue = (p.hue + time * 25) % 360;
      ctx.fillStyle = `hsla(${hue}, 100%, ${58 + speed * 1.5}%, 0.9)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + speed * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  function move(e) {
    const pt = e.touches ? e.touches[0] : e;
    mouse.x = pt.clientX; mouse.y = pt.clientY;
  }
  addEventListener('pointermove', move);
  addEventListener('touchmove', move, { passive: true });
  addEventListener('pointerdown', e => { move(e); mouse.down = true; });
  addEventListener('pointerup', () => { mouse.down = false; });
  addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });
  addEventListener('touchend', () => { mouse.x = mouse.y = -9999; mouse.down = false; });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });

  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
